<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Run — Retro</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0e1017;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  body { display: grid; place-items: center; }
  .game-shell {
    width: min(1180px, 100vw);
    padding: 12px;
  }
  .top {
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:center;
    color:#fff;
    margin:0 0 8px 0;
    font-size:14px;
  }
  .title { font-weight:900; letter-spacing:1px; }
  .keys { opacity:.82; text-align:right; }
  canvas {
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    background:#75c8ed;
    border:4px solid #f4f4ef;
    box-shadow:0 0 0 4px #272a33, 0 18px 50px rgba(0,0,0,.5);
    image-rendering:pixelated;
  }
  .legend {
    color:#bdc6d6;
    font-size:12px;
    margin-top:8px;
    line-height:1.45;
  }
</style>
</head>
<body>
<div class="game-shell">
  <div class="top">
    <div class="title">MONEY RUN — RETRO ESCAPE</div>
    <div class="keys">← → mover &nbsp; ↑ pular &nbsp; ↓ abaixar &nbsp; R reiniciar</div>
  </div>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="legend">
    Dinheiro = pontos • Mortadela = +1 vida • INSS / Petróleo / MASTER = bônus raros • STF = +3 vidas • Estrela 13 = dinheiro ×2 temporariamente
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = 430;

  const keys = {};
  let last = 0;
  let distance = 0;
  let score = 0;
  let cashTotal = 0;
  let multiplier = 1;
  let multiplierTimer = 0;
  let gameOver = false;
  let speed = 5.3;
  let obstacleTimer = 0;
  let cashTimer = 0;
  let rareTimer = 0;
  let movingHazardTimer = 0;
  let shake = 0;
  let flashText = "";
  let flashTimer = 0;
  let flashY = 220;

  const obstacles = [];
  const moneyItems = [];
  const rareItems = [];
  const movingHazards = [];
  const particles = [];

  const player = {
    x: 120, y: GROUND - 101,
    w: 66, h: 101,
    vy: 0,
    onGround: true,
    ducking: false,
    lives: 3,
    maxLives: 5,
    inv: 0
  };

  const buildings = [
    {x:0,w:140,h:190,c:"#d4896e"},
    {x:140,w:175,h:235,c:"#7b93af"},
    {x:315,w:110,h:165,c:"#caa16d"},
    {x:425,w:210,h:255,c:"#8d738d"},
    {x:635,w:130,h:200,c:"#678c84"},
    {x:765,w:205,h:225,c:"#b17f72"}
  ];

  function reset() {
    obstacles.length = 0;
    moneyItems.length = 0;
    rareItems.length = 0;
    movingHazards.length = 0;
    particles.length = 0;

    player.x = 120;
    player.y = GROUND - player.h;
    player.vy = 0;
    player.onGround = true;
    player.ducking = false;
    player.lives = 3;
    player.inv = 0;

    distance = 0;
    score = 0;
    cashTotal = 0;
    multiplier = 1;
    multiplierTimer = 0;
    speed = 5.3;
    obstacleTimer = 700;
    cashTimer = 450;
    rareTimer = 4500;
    movingHazardTimer = 2500;
    gameOver = false;
    flashText = "";
    flashTimer = 0;
    shake = 0;
  }

  addEventListener("keydown", e => {
    keys[e.key] = true;
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
    if (e.key.toLowerCase() === "r") reset();
  });

  addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  function rects(a,b) {
    return a.x < b.x+b.w && a.x+a.w > b.x &&
           a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function px(x,y,w,h,c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  }

  function text(txt,x,y,size=16,color="#fff",align="left",weight="bold") {
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px Courier New`;
    ctx.fillText(txt,x,y);
    ctx.textAlign = "left";
  }

  function popup(msg, y=220) {
    flashText = msg;
    flashTimer = 1200;
    flashY = y;
  }

  function particlesBurst(x,y,color,count=12) {
    for (let i=0;i<count;i++) {
      particles.push({
        x,y,
        vx:(Math.random()-.5)*5,
        vy:-1-Math.random()*4,
        a:1,
        color
      });
    }
  }

  function spawnObstacle() {
    const types = ["cone","crate","barrier","hydrant"];
    const type = types[(Math.random()*types.length)|0];
    let w=44,h=52;
    if(type==="cone"){w=34;h=48;}
    if(type==="crate"){w=58;h=58;}
    if(type==="barrier"){w=76;h=44;}
    if(type==="hydrant"){w=36;h=54;}
    obstacles.push({x:W+40,y:GROUND-h,w,h,type,hit:false});
  }

  function spawnMoney() {
    const high = Math.random() < .45;
    moneyItems.push({
      x:W+40,
      y:high ? GROUND-150 : GROUND-84,
      w:34,h:20,
      bob:Math.random()*Math.PI*2,
      taken:false,
      value:100
    });
  }

  function spawnRare() {
    const r = Math.random();
    let type;
    if (r < .22) type = "mortadela";
    else if (r < .40) type = "inss";
    else if (r < .58) type = "oil";
    else if (r < .74) type = "master";
    else if (r < .88) type = "stf";
    else type = "star13";

    const high = Math.random() < .55;
    rareItems.push({
      type,
      x:W+50,
      y:high ? GROUND-165 : GROUND-95,
      w:50,
      h:42,
      bob:Math.random()*6,
      taken:false
    });
  }

  function spawnMovingHazard() {
    const type = Math.random() < .5 ? "handcuffs" : "notebook";
    if(type==="handcuffs") {
      movingHazards.push({
        type,
        x:W+60,
        y:GROUND-110,
        w:58,h:28,
        vx:-(speed+3.4),
        phase:Math.random()*6,
        hit:false
      });
    } else {
      movingHazards.push({
        type,
        x:W+60,
        y:GROUND-50,
        w:46,h:50,
        vx:-(speed+2.2),
        phase:Math.random()*6,
        hit:false
      });
    }
  }

  function hitPlayer() {
    if(player.inv > 0) return;
    player.lives--;
    player.inv = 1400;
    player.vy = -6.5;
    player.onGround = false;
    shake = 13;
    popup("-1 VIDA", 180);
    if(player.lives <= 0) gameOver = true;
  }

  function collectRare(item) {
    if(item.taken) return;
    item.taken = true;

    switch(item.type) {
      case "mortadela":
        if(player.lives < player.maxLives) player.lives++;
        cashTotal += 500 * multiplier;
        popup("MORTADELA! +1 VIDA", 185);
        particlesBurst(item.x,item.y,"#f08ca3",18);
        break;
      case "inss":
        cashTotal += 3000 * multiplier;
        popup("INSS +$3000", 185);
        particlesBurst(item.x,item.y,"#4aa2ff",18);
        break;
      case "oil":
        cashTotal += 4000 * multiplier;
        popup("PETRÓLEO +$4000", 185);
        particlesBurst(item.x,item.y,"#1a1a1a",20);
        break;
      case "master":
        cashTotal += 5000 * multiplier;
        popup("MASTER +$5000", 185);
        particlesBurst(item.x,item.y,"#ffd34d",22);
        break;
      case "stf":
        player.lives = Math.min(player.maxLives, player.lives + 3);
        popup("STF! +3 VIDAS", 185);
        particlesBurst(item.x,item.y,"#8bd3ff",24);
        break;
      case "star13":
        multiplier = 2;
        multiplierTimer = 12000;
        popup("ESTRELA 13! DINHEIRO ×2", 185);
        particlesBurst(item.x,item.y,"#e83333",26);
        break;
    }
  }

  function update(dt) {
    if(gameOver) return;

    const s = dt/16.67;
    speed = Math.min(12, 5.3 + distance/2600);
    distance += speed * s * 0.35;

    if(multiplierTimer > 0) {
      multiplierTimer -= dt;
      if(multiplierTimer <= 0) {
        multiplier = 1;
        multiplierTimer = 0;
        popup("MULTIPLICADOR ACABOU", 185);
      }
    }

    if(flashTimer > 0) flashTimer -= dt;
    player.inv = Math.max(0, player.inv-dt);

    player.ducking = !!keys["ArrowDown"] && player.onGround;

    if(keys["ArrowLeft"]) player.x -= 5.2*s;
    if(keys["ArrowRight"]) player.x += 5.2*s;
    player.x = Math.max(52, Math.min(315, player.x));

    if((keys["ArrowUp"] || keys[" "]) && player.onGround && !player.ducking) {
      player.vy = -15.8;
      player.onGround = false;
    }

    player.vy += .82*s;
    player.y += player.vy*s;

    const currentH = player.ducking ? 61 : player.h;
    if(player.y + currentH >= GROUND) {
      player.y = GROUND-currentH;
      player.vy = 0;
      player.onGround = true;
    }

    if(player.onGround && Math.random()<.16) {
      particles.push({
        x:player.x+15, y:GROUND-4,
        vx:-1-Math.random()*2, vy:-Math.random()*1.3,
        a:.7, color:"#c7beb0"
      });
    }

    obstacleTimer -= dt;
    cashTimer -= dt;
    rareTimer -= dt;
    movingHazardTimer -= dt;

    if(obstacleTimer<=0) {
      spawnObstacle();
      obstacleTimer = 900 + Math.random()*900 - Math.min(350,distance*.02);
    }
    if(cashTimer<=0) {
      spawnMoney();
      cashTimer = 620 + Math.random()*850;
    }
    if(rareTimer<=0) {
      spawnRare();
      rareTimer = 5500 + Math.random()*6000;
    }
    if(movingHazardTimer<=0) {
      spawnMovingHazard();
      movingHazardTimer = 3000 + Math.random()*3800;
    }

    obstacles.forEach(o => o.x -= speed*s);
    moneyItems.forEach(m => { m.x -= speed*s; m.bob += .08*s; });
    rareItems.forEach(r => { r.x -= speed*s; r.bob += .06*s; });
    movingHazards.forEach(h => {
      h.x += h.vx*s;
      h.phase += .09*s;
      if(h.type==="handcuffs") h.y = GROUND-111 + Math.sin(h.phase)*9;
      if(h.type==="notebook") h.y = GROUND-50 - Math.abs(Math.sin(h.phase))*18;
    });

    particles.forEach(p => {
      p.x += p.vx*s;
      p.y += p.vy*s;
      p.vy += .12*s;
      p.a -= .028*s;
    });

    while(obstacles.length && obstacles[0].x < -120) obstacles.shift();
    while(moneyItems.length && moneyItems[0].x < -80) moneyItems.shift();
    while(rareItems.length && rareItems[0].x < -100) rareItems.shift();
    while(movingHazards.length && movingHazards[0].x < -120) movingHazards.shift();
    while(particles.length && particles[0].a <= 0) particles.shift();

    const hitbox = {
      x:player.x+11,
      y:player.y+7,
      w:player.w-21,
      h:currentH-9
    };

    for(const o of obstacles) {
      if(!o.hit && rects(hitbox,o)) {
        o.hit = true;
        hitPlayer();
      }
    }

    for(const h of movingHazards) {
      if(!h.hit && rects(hitbox,h)) {
        h.hit = true;
        hitPlayer();
      }
    }

    for(const m of moneyItems) {
      const mb = {x:m.x,y:m.y+Math.sin(m.bob)*7,w:m.w,h:m.h};
      if(!m.taken && rects(hitbox,mb)) {
        m.taken = true;
        const got = m.value * multiplier;
        cashTotal += got;
        popup(`+$${got}`, 220);
        particlesBurst(m.x,m.y,"#62d177",7);
      }
    }

    for(const r of rareItems) {
      const rb = {x:r.x,y:r.y+Math.sin(r.bob)*7,w:r.w,h:r.h};
      if(!r.taken && rects(hitbox,rb)) collectRare(r);
    }

    score = Math.floor(distance + cashTotal);
  }

  function drawBackground() {
    px(0,0,W,H,"#73c9f1");
    px(755,48,76,76,"#ffd65a");

    let ox = -(distance*.38)%970;
    for(let rep=-1;rep<3;rep++) {
      buildings.forEach((b,i)=>{
        const x = ox+b.x+rep*970;
        px(x,GROUND-b.h-95,b.w,b.h,b.c);
        px(x,GROUND-b.h-101,b.w,8,"#504957");

        for(let yy=GROUND-b.h-73; yy<GROUND-120; yy+=34) {
          for(let xx=x+18; xx<x+b.w-16; xx+=35) {
            px(xx,yy,14,18,((i+Math.floor(xx/35))%3===0)?"#ffdf7a":"#40516c");
          }
        }
      });
    }

    px(0,333,W,97,"#ddd7ca");
    for(let x=-(distance*1.08)%120;x<W;x+=120) px(x,390,98,5,"#b8b1a5");
    px(0,430,W,110,"#353944");
    px(0,430,W,8,"#e7c74f");
    for(let x=-(distance*2.15)%175;x<W;x+=175) px(x,496,88,8,"#f2f0e7");
  }

  function drawPlayer() {
    if(player.inv>0 && ((player.inv/85)|0)%2===0) return;

    const x=player.x, y=player.y;
    const duck=player.ducking;

    if(duck) {
      // legs/shoes
      px(x+17,y+48,18,10,"#263249");
      px(x+38,y+48,18,10,"#263249");
      px(x+10,y+55,27,6,"#17191d");
      px(x+35,y+55,27,6,"#17191d");

      // suitcase
      px(x-12,y+20,29,32,"#5a3822");
      px(x-8,y+24,22,24,"#875632");
      px(x-3,y+14,10,7,"#362216");
      px(x-2,y+34,8,6,"#e5b64d");

      // torso
      px(x+11,y+18,49,34,"#27344d");
      px(x+17,y+21,37,27,"#f2eee0");
      px(x+34,y+22,6,19,"#a51f2e");
      px(x+31,y+38,11,10,"#a51f2e");

      // head
      px(x+18,y+1,38,27,"#e3aa7c");
      px(x+14,y+8,46,16,"#e3aa7c");

      // white hat
      px(x+17,y-9,39,10,"#f5f5ef");
      px(x+12,y-2,50,7,"#f5f5ef");
      px(x+23,y-13,27,6,"#f5f5ef");

      // eyes
      px(x+25,y+11,3,3,"#111");
      px(x+46,y+11,3,3,"#111");

      // beard
      px(x+24,y+19,26,8,"#8f9399");
      px(x+28,y+26,18,5,"#8f9399");
      return;
    }

    // legs
    px(x+18,y+74,14,23,"#263249");
    px(x+41,y+74,14,23,"#263249");
    px(x+12,y+93,25,8,"#17191d");
    px(x+37,y+93,25,8,"#17191d");

    // suitcase
    px(x-14,y+47,31,36,"#573621");
    px(x-10,y+51,23,28,"#875632");
    px(x-4,y+40,11,8,"#362216");
    px(x-2,y+65,8,6,"#e7b84c");
    px(x-8,y+57,20,4,"#5c381f");

    // suit/body — intentionally round/chubby
    px(x+8,y+37,53,45,"#27344d");
    px(x+5,y+47,59,27,"#27344d");
    px(x+16,y+40,38,34,"#f2eee0");
    px(x+10,y+40,8,38,"#27344d");
    px(x+54,y+40,7,38,"#27344d");

    // red tie
    px(x+34,y+40,7,24,"#ad2031");
    px(x+31,y+60,13,12,"#ad2031");

    // arms
    px(x+1,y+44,11,31,"#27344d");
    px(x+60,y+43,11,31,"#27344d");
    px(x+1,y+67,11,10,"#dfa577");
    px(x+60,y+66,11,10,"#dfa577");

    // head
    px(x+18,y+4,38,31,"#e4aa7c");
    px(x+14,y+12,46,18,"#e4aa7c");
    px(x+11,y+16,7,11,"#d29168");
    px(x+56,y+16,7,11,"#d29168");

    // white hat
    px(x+18,y-8,38,11,"#f8f8f2");
    px(x+11,y+1,52,7,"#f8f8f2");
    px(x+24,y-13,26,7,"#f8f8f2");
    px(x+23,y-2,29,4,"#d9d9d1");

    // eyes / brows
    px(x+22,y+15,8,3,"#3e2a22");
    px(x+43,y+15,8,3,"#3e2a22");
    px(x+25,y+20,3,3,"#111");
    px(x+46,y+20,3,3,"#111");

    // beard and moustache
    px(x+26,y+26,22,5,"#8d9298");
    px(x+22,y+29,30,7,"#8d9298");
    px(x+26,y+35,22,7,"#8d9298");
    px(x+30,y+40,14,3,"#8d9298");
    px(x+31,y+27,13,3,"#666b72");
  }

  function drawObstacle(o) {
    if(o.type==="cone") {
      px(o.x+8,o.y,18,32,"#ef741e");
      px(o.x+5,o.y+29,24,7,"#f4f0e7");
      px(o.x,o.y+39,34,9,"#c85a18");
    } else if(o.type==="crate") {
      px(o.x,o.y,o.w,o.h,"#82592f");
      px(o.x+5,o.y+5,o.w-10,o.h-10,"#aa7840");
      px(o.x+8,o.y+24,o.w-16,8,"#714724");
      px(o.x+10,o.y+9,7,o.h-18,"#714724");
      px(o.x+o.w-17,o.y+9,7,o.h-18,"#714724");
    } else if(o.type==="barrier") {
      px(o.x,o.y+12,o.w,21,"#dd5b4b");
      for(let i=0;i<o.w;i+=22) px(o.x+i,o.y+12,11,21,"#f4ead7");
      px(o.x+11,o.y+33,8,11,"#262a31");
      px(o.x+o.w-19,o.y+33,8,11,"#262a31");
    } else {
      px(o.x+8,o.y+8,20,37,"#d54d41");
      px(o.x+4,o.y+16,28,10,"#d54d41");
      px(o.x+12,o.y,12,12,"#d54d41");
      px(o.x+7,o.y+44,22,10,"#9e302c");
    }
  }

  function drawMoney(m) {
    if(m.taken) return;
    const y=m.y+Math.sin(m.bob)*7;
    px(m.x,y,m.w,m.h,"#45b962");
    px(m.x+4,y+4,m.w-8,m.h-8,"#80dc8e");
    px(m.x+14,y+4,6,12,"#267a40");
    px(m.x+2,y+2,4,4,"#e3f6bf");
    text("$",m.x+17,y+15,12,"#215f34","center");
  }

  function drawRare(r) {
    if(r.taken) return;
    const x=r.x, y=r.y+Math.sin(r.bob)*7;

    if(r.type==="mortadela") {
      // elongated mortadella sandwich
      px(x-7,y+10,64,10,"#d69a56");
      px(x-4,y+20,58,7,"#f0cf72");
      px(x-2,y+27,54,5,"#74a64d");
      px(x,y+32,50,8,"#e9869c");
      px(x+6,y+29,16,11,"#ef9aae");
      px(x+24,y+30,18,10,"#dd748d");
      px(x+40,y+31,10,9,"#ee93a8");
      px(x-6,y+40,62,9,"#d69a56");
      px(x-2,y+40,54,4,"#efbf72");
      px(x+3,y+13,8,3,"#edbf77");
      px(x+41,y+13,7,3,"#edbf77");
    }

    if(r.type==="inss") {
      px(x,y+5,50,35,"#1d75c9");
      px(x+4,y+9,42,27,"#e8f4ff");
      text("INSS",x+25,y+29,15,"#165f9d","center");
    }

    if(r.type==="oil") {
      px(x+8,y+2,34,42,"#d86b1f");
      px(x+6,y+8,38,7,"#f08a32");
      px(x+6,y+31,38,7,"#f08a32");
      px(x+11,y+6,28,34,"#c75a14");
      text("OIL",x+25,y+27,12,"#f1d35e","center");
    }

    if(r.type==="master") {
      px(x+1,y+8,48,31,"#171a20");
      px(x+4,y+11,42,25,"#292e38");
      px(x+7,y+14,36,19,"#f0bf35");
      text("MASTER",x+25,y+28,10,"#171a20","center");
      px(x+4,y+39,42,4,"#e0aa22");
    }

    if(r.type==="stf") {
      px(x+3,y+4,44,38,"#eaf5ff");
      px(x+6,y+7,38,32,"#6caee0");
      px(x+9,y+10,32,26,"#ddecf7");
      text("STF",x+25,y+29,15,"#24557a","center");
    }

    if(r.type==="star13") {
      // blocky red star
      const pts = [
        [25,0],[31,15],[48,15],[35,25],[40,42],
        [25,32],[10,42],[15,25],[2,15],[19,15]
      ];
      ctx.fillStyle="#d92929";
      ctx.beginPath();
      ctx.moveTo(x+pts[0][0],y+pts[0][1]);
      pts.slice(1).forEach(p=>ctx.lineTo(x+p[0],y+p[1]));
      ctx.closePath();
      ctx.fill();
      text("13",x+25,y+25,14,"#fff","center");
    }
  }

  function drawMovingHazard(h) {
    if(h.type==="handcuffs") {
      // two silver cuffs at head/torso level: duck under
      ctx.strokeStyle="#2a1b05";
      ctx.lineWidth=8;
      ctx.beginPath();
      ctx.arc(h.x+15,h.y+14,11,0,Math.PI*2);
      ctx.arc(h.x+43,h.y+14,11,0,Math.PI*2);
      ctx.stroke();

      ctx.strokeStyle="#ffd84a";
      ctx.lineWidth=5;
      ctx.beginPath();
      ctx.arc(h.x+15,h.y+14,11,0,Math.PI*2);
      ctx.arc(h.x+43,h.y+14,11,0,Math.PI*2);
      ctx.stroke();

      px(h.x+25,h.y+10,8,8,"#2a1b05");
      px(h.x+26,h.y+11,6,6,"#ffd84a");
      px(h.x+31,h.y+11,7,6,"#ffb51f");
    } else {
      // blue notebook bouncing at ground level: jump
      px(h.x+4,h.y,38,48,"#286bb1");
      px(h.x+8,h.y+4,30,40,"#347fc7");
      px(h.x+2,h.y,5,48,"#173f71");
      for(let i=7;i<43;i+=8) px(h.x,h.y+i,8,3,"#d4d9df");
      px(h.x+10,h.y+9,26,24,"#2b74b9");
      text("TRABALHO",h.x+23,h.y+24,7,"#ffffff","center");
    }
  }

  function drawHUD() {
    px(16,16,355,82,"rgba(15,18,26,.82)");
    text(`SCORE ${String(score).padStart(7,"0")}`,31,45,21,"#fff");
    text(`DINHEIRO $${cashTotal}`,31,74,18,"#82e892");

    text("VIDAS",720,39,18,"#fff");
    for(let i=0;i<player.lives;i++) {
      px(789+i*31,25,18,18,"#e95b5b");
      px(785+i*31,30,26,11,"#e95b5b");
    }

    if(multiplier>1) {
      px(684,58,252,38,"rgba(134,20,20,.82)");
      text(`★13  DINHEIRO ×2  ${Math.ceil(multiplierTimer/1000)}s`,810,83,16,"#ffd9d9","center");
    }
  }

  function drawNotice() {
    if(flashTimer<=0 || !flashText) return;
    const alpha=Math.min(1,flashTimer/250);
    ctx.globalAlpha=alpha;
    text(flashText,W/2,flashY,24,"#fff","center");
    ctx.globalAlpha=1;
  }

  function drawGameOver() {
    px(175,125,610,250,"rgba(8,10,15,.91)");
    text("PEGARAM VOCÊ!",W/2,205,43,"#ffdb59","center");
    text(`Score final: ${score}`,W/2,258,24,"#fff","center");
    text(`Dinheiro roubado do povo: $${cashTotal}`,W/2,295,20,"#82e892","center");
    text("Pressione R para tentar de novo",W/2,342,18,"#ddd","center");
  }

  function render() {
    ctx.save();

    if(shake>0) {
      ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
      shake*=.82;
      if(shake<.4) shake=0;
    }

    drawBackground();

    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.a);
      px(p.x,p.y,6,6,p.color);
      ctx.globalAlpha=1;
    });

    moneyItems.forEach(drawMoney);
    rareItems.forEach(drawRare);
    obstacles.forEach(drawObstacle);
    movingHazards.forEach(drawMovingHazard);
    drawPlayer();
    drawHUD();
    drawNotice();

    if(gameOver) drawGameOver();

    ctx.restore();
  }

  function loop(t) {
    const dt=Math.min(33,t-last||16.67);
    last=t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
